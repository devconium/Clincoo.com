  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

<body class="bg-[#f7f7f9] text-gray-900 min-h-screen flex flex-col">
  <div class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200/60">
    <div class="w-full max-w-5xl px-4 sm:px-6 mx-auto">
      <div class="flex items-center justify-between h-14">
        <div class="flex items-center gap-1.5 sm:gap-3 min-w-0">
          <button onclick="goBack()" class="flex-shrink-0 flex items-center text-gray-500 hover:text-black transition-all rounded-full p-1.5 sm:p-2 hover:bg-gray-100 -ml-1.5 sm:-ml-2" aria-label="Kembali">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
          </button>
          <h2 class="text-xl font-bold text-gray-800 tracking-tight whitespace-nowrap">Keamanan</h2>
        </div>
        <a href="index.html" class="flex items-center justify-center">
          <img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2216%22%20fill%3D%22%23ffffff%22%2F%3E%0A%20%20%3Cg%20fill%3D%22%23000000%22%3E%0A%20%20%20%20%3Cpath%20d%3D%22M10%2016C7%2010%209%207%2012%207C14%207%2015%2011%2013%2016Z%22%2F%3E%3Cpath%20d%3D%22M12%209C10.5%2011%2011%2013%2012%2014.5C13%2013%2013.5%2011%2012%209Z%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.25%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M22%2016C25%2010%2023%207%2020%207C18%207%2017%2011%2019%2016Z%22%2F%3E%3Cpath%20d%3D%22M20%209C21.5%2011%2021%2013%2020%2014.5C19%2013%2018.5%2011%2020%209Z%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.25%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M16%2027C24%2027%2028%2022.5%2028%2017C28%2012.5%2021%2011.5%2016%2011.5C11%2011.5%204%2012.5%204%2017C4%2022.5%208%2027%2016%2027Z%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%20%20%3Ccircle%20cx%3D%2212.5%22%20cy%3D%2217%22%20r%3D%221.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.6%22%2F%3E%3Ccircle%20cx%3D%2219.5%22%20cy%3D%2217%22%20r%3D%221.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.6%22%2F%3E%3Cpolygon%20points%3D%2216%2C20%2015%2C18.5%2017%2C18.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.5%22%2F%3E%0A%3C%2Fsvg%3E" alt="App Logo" class="w-8 h-8 md:w-9 md:h-9 rounded-full overflow-hidden bg-white shadow-sm hover:scale-105 transition-transform cursor-pointer">
        </a>
      </div>
    </div>
  </div>
  <main class="flex-1 overflow-y-auto no-scrollbar">
    <div class="max-w-2xl mx-auto w-full pb-12 pt-6 px-4">
      <div class="space-y-4">
        <div class="bg-white rounded-[24px] border border-gray-200 overflow-hidden">
          <div class="px-5 py-4 border-b border-gray-100"><p class="text-base font-bold text-gray-900">Token GitHub</p></div>
          <div class="px-5 py-4 space-y-3">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm font-medium text-gray-900">Status koneksi</p>
                <p class="text-xs text-gray-500 mt-0.5" id="gh-token-status">Mengecek...</p>
              </div>
              <span id="gh-token-badge" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-500">--</span>
            </div>
            <div class="flex gap-2">
              <button onclick="connectGithub()" class="flex-1 px-4 py-2.5 bg-gray-900 text-white text-sm font-medium rounded-xl hover:bg-gray-800 transition-colors active:scale-95">Hubungkan</button>
              <button onclick="disconnectGithub()" id="gh-disconnect-btn" class="flex-1 px-4 py-2.5 bg-white border border-gray-200 text-gray-700 text-sm font-medium rounded-xl hover:bg-gray-50 transition-colors active:scale-95 hidden">Putuskan</button>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-[24px] border border-gray-200 overflow-hidden">
          <div class="px-5 py-4 border-b border-gray-100"><p class="text-base font-bold text-gray-900">Domain Custom</p></div>
          <div class="px-5 py-4">
            <p class="text-sm text-gray-600 leading-relaxed">Kelola domain khusus dari tab Halaman pada setiap proyek di Clincoo.</p>
            <button onclick="window.location.href='index.html'" class="mt-3 px-4 py-2 bg-gray-100 text-gray-700 text-sm font-medium rounded-xl hover:bg-gray-200 transition-colors">Buka Proyek</button>
          </div>
        </div>
        <div class="bg-white rounded-[24px] border border-gray-200 overflow-hidden">
          <div class="px-5 py-4 border-b border-gray-100"><p class="text-base font-bold text-gray-900">Environment Variables</p></div>
          <div class="px-5 py-4">
            <p class="text-sm text-gray-600 leading-relaxed">Variabel lingkungan dienkripsi dan disimpan dengan aman per proyek. Kelola dari tab Environment pada detail proyek.</p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script>
    function goBack() {
      if (document.referrer && document.referrer.toLowerCase().indexOf('clincoo') !== -1) { history.back(); } else { window.location.href = 'profile.html'; }
    }
    function loadKeamananData() {
      var ghToken = localStorage.getItem('github_token') || '';
      var statusEl = document.getElementById('gh-token-status');
      var badgeEl = document.getElementById('gh-token-badge');
      var disconnectBtn = document.getElementById('gh-disconnect-btn');
      if (ghToken) {
        statusEl.textContent = 'Token tersimpan dan aktif';
        badgeEl.textContent = 'Terhubung';
        badgeEl.className = 'px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-600';
        disconnectBtn.classList.remove('hidden');
      } else {
        statusEl.textContent = 'Belum ada token GitHub';
        badgeEl.textContent = 'Belum';
        badgeEl.className = 'px-2.5 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-500';
        disconnectBtn.classList.add('hidden');
      }
    }
    function connectGithub() {
      var token = prompt('Masukkan GitHub Personal Access Token:');
      if (token && token.trim()) { localStorage.setItem('github_token', token.trim()); loadKeamananData(); }
    }
    function disconnectGithub() {
      if (confirm('Putuskan koneksi GitHub?')) { localStorage.removeItem('github_token'); loadKeamananData(); }
    }
    loadKeamananData();
  </script>
</body>
</html>
