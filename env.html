  <script>
    let projects = [];
    let currentFolderPath = 'root';
    let projectFilesData = { 'root': [] };
    let currentProjectId = null;
    let activeItemName = null;

    const STORAGE_KEY_PROJECTS = 'clincoo_projects_v2';
    let STORAGE_KEY_FILES = 'clincoo_' + (currentProjectId || 'default') + '_files';

    function updateFilesKey() { STORAGE_KEY_FILES = 'clincoo_' + (currentProjectId || 'default') + '_files'; }

    function loadData() {
      const savedProjects = localStorage.getItem(STORAGE_KEY_PROJECTS);
      if (savedProjects) {
        try { projects = JSON.parse(savedProjects); } catch (e) { projects = []; }
      }
    }

    function loadProjectFiles() {
      updateFilesKey();
      const savedFiles = localStorage.getItem(STORAGE_KEY_FILES);
      if (savedFiles) {
        try { projectFilesData = JSON.parse(savedFiles); } catch (e) { projectFilesData = { 'root': [] }; }
      } else {
        projectFilesData = { 'root': [] };
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY_PROJECTS, JSON.stringify(projects));
      localStorage.setItem(STORAGE_KEY_FILES, JSON.stringify(projectFilesData));
    }

    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const sidebarPanel = document.getElementById('sidebar-panel');
    let isSidebarOpen = false;

    function toggleSidebar() {
      isSidebarOpen = !isSidebarOpen;
      if (isSidebarOpen) {
        sidebar.classList.remove('hidden');
        setTimeout(() => {
          sidebarOverlay.classList.remove('opacity-0');
          sidebarPanel.classList.remove('-translate-x-full');
        }, 10);
      } else {
        sidebarOverlay.classList.add('opacity-0');
        sidebarPanel.classList.add('-translate-x-full');
        setTimeout(() => {
          sidebar.classList.add('hidden');
        }, 300);
      }
    }

    function safeNavigate(url) {
      window.location.href = url;
    }

    function navigateTo(path) {
      const url = new URL(window.location);
      if (path === '/' || path === '') url.searchParams.delete('p');
      else url.searchParams.set('p', path);
      window.history.pushState({}, '', url);
      handleRoute();
    }

    function handleRoute() {
      const params = new URLSearchParams(window.location.search);
      let path = params.get('p');
      
      if (!path || path === '/') {
          if (projects.length > 0) {
              path = '/proyek/' + projects[0].id;
              const url = new URL(window.location);
              url.searchParams.set('p', path);
              window.history.replaceState({}, '', url);
          }
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (path && path.startsWith('/proyek/')) {
        const id = parseInt(path.replace('/proyek/', ''));
        setupDetailPage(id);
      }
    }

    window.addEventListener('popstate', handleRoute);

    function setupDetailPage(id) {
      if (currentProjectId !== id) {
        currentFolderPath = 'root';
      }
      currentProjectId = id;
      loadProjectFiles();
      
      const proj = projects.find(p => p.id === id);
      const nameEl = document.getElementById('current-project-name');
      if (nameEl && proj) {
        nameEl.textContent = proj.name;
      }
    }

    function toggleProjectDropdown(e) {
      e.stopPropagation();
      const dropdown = document.getElementById('project-shortcut-dropdown');
      const list = document.getElementById('project-shortcut-list');
      
      if (dropdown.classList.contains('hidden')) {
        list.innerHTML = '';
        projects.forEach(p => {
          const btn = document.createElement('button');
          btn.className = `w-full text-left px-4 py-2.5 text-sm transition-colors ${p.id === currentProjectId ? 'bg-gray-200 text-gray-800 font-medium rounded-lg' : 'text-gray-700 hover:bg-gray-50 rounded-lg'}`;
          btn.textContent = p.name;
          btn.onclick = () => { dropdown.classList.add('hidden'); navigateTo('/proyek/' + p.id); };
          list.appendChild(btn);
        });
        dropdown.classList.remove('hidden');
      } else {
        dropdown.classList.add('hidden');
      }
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('border-black', 'text-black');
        btn.classList.add('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
        btn.removeAttribute('aria-current');
      });
      if (el) {
        el.classList.remove('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
        el.classList.add('border-black', 'text-black');
        el.setAttribute('aria-current', 'page');
      }
      
      const tabKeamanan = document.getElementById('tab-content-keamanan');
      const tabEnv = document.getElementById('tab-content-environment');
      
      if (tabKeamanan) {
        if (tabId === 'keamanan') {
          tabKeamanan.classList.remove('hidden');
          tabKeamanan.classList.add('flex');
        } else {
          tabKeamanan.classList.add('hidden');
          tabKeamanan.classList.remove('flex');
        }
      }
      if (tabEnv) {
        if (tabId === 'environment') {
          tabEnv.classList.remove('hidden');
          tabEnv.classList.add('flex');
        } else {
          tabEnv.classList.add('hidden');
          tabEnv.classList.remove('flex');
        }
      }
    }

    function toggleNotifications(e) {
      e.stopPropagation();
      const notif = document.getElementById('notif-dropdown');
      notif.classList.toggle('hidden');
    }

    function openItemActionMenu(e, itemName) {
      e.stopPropagation();
      activeItemName = itemName;
      const menu = document.getElementById('item-action-menu');
      menu.classList.remove('hidden');
      
      const rect = e.currentTarget.getBoundingClientRect();
      const menuWidth = 176;
      let left = rect.left - menuWidth + rect.width;
      let top = rect.bottom + 4;
      
      if (left < 10) left = 10;
      if (top + menu.offsetHeight > window.innerHeight) top = rect.top - menu.offsetHeight - 4;
      
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
    }

    function openEnvMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('env-action-menu');
      menu.classList.remove('hidden');
      
      const rect = e.currentTarget.getBoundingClientRect();
      const menuWidth = 128; // width of w-32
      let left = rect.left - menuWidth + rect.width;
      let top = rect.bottom + 4;
      
      if (left < 10) left = 10;
      if (top + menu.offsetHeight > window.innerHeight) top = rect.top - menu.offsetHeight - 4;
      
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
    }

    function saveEnv() {
        const keyInput = document.getElementById('env-key');
        const valInput = document.getElementById('env-value');
        if(!keyInput.value || !valInput.value) return;

        const list = document.getElementById('env-list');
        const newItem = document.createElement('div');
        newItem.className = 'flex items-center gap-2 sm:gap-3 w-full group animate-fade-in';
        newItem.innerHTML = `
           <input type="text" value="${keyInput.value}" readonly class="flex-1 min-w-0 bg-gray-50 border border-gray-200 text-gray-500 px-3 sm:px-4 py-3 rounded-xl text-xs sm:text-sm font-mono cursor-not-allowed focus:outline-none pointer-events-none truncate">
           <input type="password" value="${valInput.value}" readonly class="flex-1 min-w-0 bg-gray-50 border border-gray-200 text-gray-500 px-3 sm:px-4 py-3 rounded-xl text-xs sm:text-sm font-mono cursor-not-allowed focus:outline-none pointer-events-none tracking-widest sm:tracking-[0.2em] truncate">
           <button onclick="openEnvMenu(event)" class="p-2 sm:p-2.5 text-gray-400 hover:text-gray-700 rounded-xl hover:bg-gray-200 transition-colors focus:outline-none flex-shrink-0" aria-label="Opsi">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z" />
              </svg>
           </button>
        `;
        list.appendChild(newItem);
        keyInput.value = '';
        valInput.value = '';
    }

    document.addEventListener('click', (e) => {
      const pDrop = document.getElementById('project-shortcut-dropdown');
      if (pDrop && !pDrop.contains(e.target)) pDrop.classList.add('hidden');
      
      const nDrop = document.getElementById('notif-dropdown');
      if (nDrop && !nDrop.contains(e.target)) nDrop.classList.add('hidden');
      
      const aMenu = document.getElementById('item-action-menu');
      if (aMenu && !aMenu.contains(e.target)) aMenu.classList.add('hidden');
      
      const envMenu = document.getElementById('env-action-menu');
      if (envMenu && !envMenu.contains(e.target)) envMenu.classList.add('hidden');
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      
      if (projects.length === 0) {
          projects.push({ id: 1, name: 'Proyek Realtime', desc: 'Sistem Langsung', visibility: 'public' });
          saveData();
      }

      const params = new URLSearchParams(window.location.search);
      let path = params.get('p');
      
      if (!path || path === '/' || path === '') {
          path = '/proyek/' + projects[0].id;
          const url = new URL(window.location);
          url.searchParams.set('p', path);
          window.history.replaceState({}, '', url);
      }
      
      handleRoute();
    });
  </script>
</body>
</html>
