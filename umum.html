<body class="bg-[#f7f7f9] text-gray-900 min-h-screen flex flex-col">
  <div class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200/60">
    <div class="w-full max-w-5xl px-4 sm:px-6 mx-auto">
      <div class="flex items-center justify-between h-14">
        <div class="flex items-center gap-1.5 sm:gap-3 min-w-0">
          <button onclick="goBack()" class="flex-shrink-0 flex items-center text-gray-500 hover:text-black transition-all rounded-full p-1.5 sm:p-2 hover:bg-gray-100 -ml-1.5 sm:-ml-2" aria-label="Kembali">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
          </button>
          <h2 class="text-xl font-bold text-gray-800 tracking-tight whitespace-nowrap">Umum</h2>
        </div>
        <a href="index.html" class="flex items-center justify-center">
          <img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2216%22%20fill%3D%22%23ffffff%22%2F%3E%0A%20%20%3Cg%20fill%3D%22%23000000%22%3E%0A%20%20%20%20%3Cpath%20d%3D%22M10%2016C7%2010%209%207%2012%207C14%207%2015%2011%2013%2016Z%22%2F%3E%3Cpath%20d%3D%22M12%209C10.5%2011%2011%2013%2012%2014.5C13%2013%2013.5%2011%2012%209Z%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.25%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M22%2016C25%2010%2023%207%2020%207C18%207%2017%2011%2019%2016Z%22%2F%3E%3Cpath%20d%3D%22M20%209C21.5%2011%2021%2013%2020%2014.5C19%2013%2018.5%2011%2020%209Z%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.25%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M16%2027C24%2027%2028%2022.5%2028%2017C28%2012.5%2021%2011.5%2016%2011.5C11%2011.5%204%2012.5%204%2017C4%2022.5%208%2027%2016%2027Z%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%20%20%3Ccircle%20cx%3D%2212.5%22%20cy%3D%2217%22%20r%3D%221.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.6%22%2F%3E%3Ccircle%20cx%3D%2219.5%22%20cy%3D%2217%22%20r%3D%221.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.6%22%2F%3E%3Cpolygon%20points%3D%2216%2C20%2015%2C18.5%2017%2C18.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.5%22%2F%3E%0A%3C%2Fsvg%3E" alt="App Logo" class="w-8 h-8 md:w-9 md:h-9 rounded-full overflow-hidden bg-white shadow-sm hover:scale-105 transition-transform cursor-pointer">
        </a>
      </div>
    </div>
  </div>
  <main class="flex-1 overflow-y-auto no-scrollbar">
    <div class="max-w-2xl mx-auto w-full pb-12 pt-6 px-4">
      <div class="space-y-4">
        <div class="bg-white rounded-[24px] border border-gray-200 overflow-hidden">
          <div class="px-5 py-4 border-b border-gray-100"><p class="text-base font-bold text-gray-900">Tema</p></div>
          <div class="px-5 py-3">
            <button onclick="setTheme('light')" id="theme-light" class="w-full flex items-center justify-between px-3 py-3 hover:bg-gray-50 rounded-xl transition-colors">
              <div class="flex items-center gap-3">
                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                <span class="text-sm font-medium text-gray-900">Terang</span>
              </div>
              <svg id="theme-light-check" class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            </button>
            <button onclick="setTheme('dark')" id="theme-dark" class="w-full flex items-center justify-between px-3 py-3 hover:bg-gray-50 rounded-xl transition-colors">
              <div class="flex items-center gap-3">
                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                <span class="text-sm font-medium text-gray-900">Gelap</span>
              </div>
              <svg id="theme-dark-check" class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            </button>
            <button onclick="setTheme('system')" id="theme-system" class="w-full flex items-center justify-between px-3 py-3 hover:bg-gray-50 rounded-xl transition-colors">
              <div class="flex items-center gap-3">
                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                <span class="text-sm font-medium text-gray-900">Sistem (Default)</span>
              </div>
              <svg id="theme-system-check" class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            </button>
          </div>
        </div>
        <div class="bg-white rounded-[24px] border border-gray-200 overflow-hidden">
          <div class="px-5 py-4 border-b border-gray-100"><p class="text-base font-bold text-gray-900">Bahasa</p></div>
          <div class="px-5 py-4">
            <div class="flex items-center justify-between"><span class="text-sm text-gray-600">Bahasa tampilan</span><span class="text-sm font-semibold text-gray-900">Indonesia</span></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script>
    function goBack() {
      if (document.referrer && document.referrer.toLowerCase().indexOf('clincoo') !== -1) { history.back(); } else { window.location.href = 'profile.html'; }
    }
    function loadUmumData() {
      var theme = localStorage.getItem('clincoo_theme') || 'system';
      ['light','dark','system'].forEach(function(t) {
        var check = document.getElementById('theme-'+t+'-check');
        if (check) check.className = t === theme ? 'w-5 h-5 text-blue-500' : 'w-5 h-5 text-gray-300';
      });
    }
    function setTheme(theme) {
      localStorage.setItem('clincoo_theme', theme);
      loadUmumData();
    }
    loadUmumData();
  </script>
</body>
</html>
