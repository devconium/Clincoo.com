              <div class="flex flex-col items-start flex-1"><span class="text-[16px] font-medium text-gray-900">Keamanan</span><span class="text-[13px] text-gray-500 mt-0.5" id="keamanan-subtitle">Mengecek...</span></div>
              <svg class="w-5 h-5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
            </a>
          </div>
        </div>
        <div>
          <h3 class="px-2 text-[13px] font-bold text-gray-400 mb-2 uppercase tracking-wider">Pengaturan</h3>
          <div class="bg-white rounded-[24px] overflow-hidden border border-gray-200">
            <a href="umum.html" class="w-full flex items-center px-4 py-3.5 hover:bg-gray-50 transition-colors active:bg-gray-100">
              <svg class="w-[22px] h-[22px] text-gray-900 mr-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <div class="flex flex-col items-start flex-1"><span class="text-[16px] font-medium text-gray-900">Umum</span><span class="text-[13px] text-gray-500 mt-0.5" id="umum-subtitle">Mengikuti sistem</span></div>

              <svg class="w-[22px] h-[22px] text-gray-900 mr-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <span class="text-[16px] font-medium text-gray-900 flex-1 text-left">Tentang</span>
              <svg class="w-5 h-5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>

              <span class="text-[16px] font-medium text-gray-900">Keluar</span>

  </main>
  <script>
    function goBack() {
      if (document.referrer && document.referrer.toLowerCase().indexOf('clincoo') !== -1) { history.back(); }
      else { history.back(); if (!document.referrer) window.location.href = 'index.html'; }
    }
    function getProjectCount() {
      var s = localStorage.getItem('clincoo_projects') || localStorage.getItem('clincoo_projects_v2');
      if (s) { try { return JSON.parse(s).length; } catch(e) {} } return 0;
    }
    function getNotifActiveCount() {
      var c = 0; ['deploy','dns','project'].forEach(function(t) { if (localStorage.getItem('clincoo_notif_'+t) !== 'false') c++; }); return c;
    }
    (function() {
      var userName = localStorage.getItem('clincoo_user_name') || 'Pengguna';
      var userEmail = localStorage.getItem('clincoo_user_email') || 'user@clincoo.com';
      document.getElementById('profile-name').textContent = userName;
      document.getElementById('profile-email').textContent = userEmail;
      var initials = userName.split(' ').map(function(w) { return w[0]; }).join('').substring(0, 2).toUpperCase();
      if (!initials) initials = 'U';
      document.getElementById('profile-avatar').textContent = initials;
      var ghToken = localStorage.getItem('github_token') || '';
      var ks = document.getElementById('keamanan-subtitle');
      if (ks) ks.textContent = ghToken ? 'GitHub terhubung' : 'GitHub belum terhubung';
      var theme = localStorage.getItem('clincoo_theme') || 'system';
      var us = document.getElementById('umum-subtitle');
      if (us) us.textContent = theme === 'light' ? 'Terang' : theme === 'dark' ? 'Gelap' : 'Mengikuti sistem';
      var nc = getNotifActiveCount();
      var ns = document.getElementById('notifikasi-subtitle');
      if (ns) ns.textContent = nc > 0 ? nc + ' aktif' : 'Nonaktif';
      var pc = getProjectCount();
      var ws = document.getElementById('workspace-subtitle');
      if (ws) ws.textContent = pc + ' proyek';
    })();
    function logout() {
      if (confirm('Yakin ingin keluar?')) {
        localStorage.removeItem('github_token');
        localStorage.removeItem('clincoo_user_name');
        localStorage.removeItem('clincoo_user_email');
        window.location.href = 'index.html';
      }
    }
  </script>
