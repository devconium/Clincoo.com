<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil - Clincoo</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2216%22%20fill%3D%22%23ffffff%22%2F%3E%0A%20%20%3Cg%20fill%3D%22%23000000%22%3E%0A%20%20%20%20%3Cpath%20d%3D%22M10%2016C7%2010%209%207%2012%207C14%207%2015%2011%2013%2016Z%22%2F%3E%3Cpath%20d%3D%22M12%209C10.5%2011%2011%2013%2012%2014.5C13%2013%2013.5%2011%2012%209Z%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.25%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M22%2016C25%2010%2023%207%2020%207C18%207%2017%2011%2019%2016Z%22%2F%3E%3Cpath%20d%3D%22M20%209C21.5%2011%2021%2013%2020%2014.5C19%2013%2018.5%2011%2020%209Z%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.25%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M16%2027C24%2027%2028%2022.5%2028%2017C28%2012.5%2021%2011.5%2016%2011.5C11%2011.5%204%2012.5%204%2017C4%2022.5%208%2027%2016%2027Z%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%20%20%3Ccircle%20cx%3D%2212.5%22%20cy%3D%2217%22%20r%3D%221.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.6%22%2F%3E%3Ccircle%20cx%3D%2219.5%22%20cy%3D%2217%22%20r%3D%221.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.6%22%2F%3E%3Cpolygon%20points%3D%2216%2C20%2015%2C18.5%2017%2C18.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.5%22%2F%3E%0A%3C%2Fsvg%3E">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .animate-fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-[#f7f7f9] text-gray-900 min-h-screen flex flex-col">

  <!-- Header -->
  <div class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200/60">
    <div class="w-full max-w-5xl px-4 sm:px-6 mx-auto">
      <div class="flex items-center justify-between h-14">
        <div class="flex items-center gap-1.5 sm:gap-3 min-w-0">
          <button onclick="goBack()" class="flex-shrink-0 flex items-center text-gray-500 hover:text-black transition-all rounded-full p-1.5 sm:p-2 hover:bg-gray-100 -ml-1.5 sm:-ml-2" aria-label="Kembali">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
          </button>
          <div class="flex items-center gap-1.5 sm:gap-2 relative min-w-0">
            <h2 class="text-xl font-bold text-gray-800 tracking-tight whitespace-nowrap">Profil</h2>
          </div>
        </div>
        <div class="flex items-center justify-center gap-1.5 sm:gap-2">
          <a href="index.html" class="flex items-center justify-center">
            <img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2216%22%20fill%3D%22%23ffffff%22%2F%3E%0A%20%20%3Cg%20fill%3D%22%23000000%22%3E%0A%20%20%20%20%3Cpath%20d%3D%22M10%2016C7%2010%209%207%2012%207C14%207%2015%2011%2013%2016Z%22%2F%3E%3Cpath%20d%3D%22M12%209C10.5%2011%2011%2013%2012%2014.5C13%2013%2013.5%2011%2012%209Z%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.25%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M22%2016C25%2010%2023%207%2020%207C18%207%2017%2011%2019%2016Z%22%2F%3E%3Cpath%20d%3D%22M20%209C21.5%2011%2021%2013%2020%2014.5C19%2013%2018.5%2011%2020%209Z%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.25%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M16%2027C24%2027%2028%2022.5%2028%2017C28%2012.5%2021%2011.5%2016%2011.5C11%2011.5%204%2012.5%204%2017C4%2022.5%208%2027%2016%2027Z%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%20%20%3Ccircle%20cx%3D%2212.5%22%20cy%3D%2217%22%20r%3D%221.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.6%22%2F%3E%3Ccircle%20cx%3D%2219.5%22%20cy%3D%2217%22%20r%3D%221.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.6%22%2F%3E%3Cpolygon%20points%3D%2216%2C20%2015%2C18.5%2017%2C18.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.5%22%2F%3E%0A%3C%2Fsvg%3E" alt="App Logo" class="w-8 h-8 md:w-9 md:h-9 rounded-full bg-white shadow-sm hover:scale-105 transition-transform cursor-pointer">
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto no-scrollbar">
    <div class="max-w-2xl mx-auto w-full pb-12 relative pt-6">

      <!-- Profile Info Section -->
      <div class="flex flex-col items-center px-4 pt-4 pb-6">
        <div class="relative group cursor-pointer">
          <div id="profile-avatar" class="w-[84px] h-[84px] bg-gray-900 rounded-full flex items-center justify-center text-white text-3xl font-bold shadow-md ring-4 ring-gray-100">
            U
          </div>
          <div class="absolute bottom-0 right-0 bg-white p-1.5 rounded-full shadow-md border border-gray-200">
            <svg class="w-3.5 h-3.5 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
            </svg>
          </div>
        </div>
        <h2 id="profile-name" class="mt-4 text-[22px] font-bold text-gray-900 tracking-tight">Pengguna</h2>
        <p id="profile-email" class="text-[14px] text-gray-500 mt-0.5">user@clincoo.com</p>
      </div>

      <div class="px-4 space-y-5">
        
        <!-- Group 1: Akun -->
        <div>
          <h3 class="px-2 text-[13px] font-bold text-gray-400 mb-2 uppercase tracking-wider">Akun</h3>
          <div class="bg-white rounded-[24px] overflow-hidden border border-gray-200">
            <button onclick="showSection('workspace')" class="w-full flex items-center px-4 py-3 hover:bg-gray-50 transition-colors active:bg-gray-100">
              <svg class="w-[22px] h-[22px] text-gray-900 mr-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
              </svg>
              <div class="flex flex-col items-start">
                <span class="text-[16px] font-medium text-gray-900">Workspace</span>
                <span class="text-[13px] text-gray-500 mt-0.5">Pribadi</span>
              </div>
            </button>
            <div class="h-[1px] bg-gray-200 ml-14"></div>
            <button onclick="showSection('keamanan')" class="w-full flex items-center px-4 py-3.5 hover:bg-gray-50 transition-colors active:bg-gray-100">
              <svg class="w-[22px] h-[22px] text-gray-900 mr-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
              </svg>
              <span class="text-[16px] font-medium text-gray-900">Keamanan</span>
            </button>
          </div>
        </div>

        <!-- Group 2: Pengaturan -->
        <div>
          <h3 class="px-2 text-[13px] font-bold text-gray-400 mb-2 uppercase tracking-wider">Pengaturan</h3>
          <div class="bg-white rounded-[24px] overflow-hidden border border-gray-200">
            <button onclick="showSection('umum')" class="w-full flex items-center px-4 py-3.5 hover:bg-gray-50 transition-colors active:bg-gray-100">
              <svg class="w-[22px] h-[22px] text-gray-900 mr-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span class="text-[16px] font-medium text-gray-900">Umum</span>
            </button>
            <div class="h-[1px] bg-gray-200 ml-14"></div>
            <button onclick="showSection('notifikasi')" class="w-full flex items-center px-4 py-3.5 hover:bg-gray-50 transition-colors active:bg-gray-100">
              <svg class="w-[22px] h-[22px] text-gray-900 mr-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
              </svg>
              <span class="text-[16px] font-medium text-gray-900">Notifikasi</span>
            </button>
            <div class="h-[1px] bg-gray-200 ml-14"></div>
            <button onclick="showSection('tentang')" class="w-full flex items-center px-4 py-3.5 hover:bg-gray-50 transition-colors active:bg-gray-100">
              <svg class="w-[22px] h-[22px] text-gray-900 mr-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span class="text-[16px] font-medium text-gray-900">Tentang</span>
            </button>
          </div>
        </div>

        <!-- Group 3: Keluar -->
        <div>
          <div class="bg-white rounded-[24px] overflow-hidden border border-gray-200">
            <button onclick="logout()" class="w-full flex items-center px-4 py-3.5 hover:bg-gray-50 transition-colors active:bg-gray-100">
              <svg class="w-[22px] h-[22px] text-gray-900 mr-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              <span class="text-[16px] font-medium text-gray-900">Keluar</span>
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Detail Panel (slide-up) -->
  <div id="detail-panel" class="fixed inset-0 z-[60] hidden">
    <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" onclick="closeDetail()"></div>
    <div id="detail-panel-content" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[28px] shadow-2xl max-h-[80vh] overflow-y-auto no-scrollbar transition-transform duration-300 animate-fade-in">
      <div class="sticky top-0 bg-white px-5 pt-4 pb-3 border-b border-gray-100">
        <div class="w-10 h-1 bg-gray-300 rounded-full mx-auto mb-3"></div>
        <div class="flex items-center justify-between">
          <h3 id="detail-title" class="text-lg font-bold text-gray-900"></h3>
          <button onclick="closeDetail()" class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition-colors">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
      <div id="detail-body" class="px-5 py-4"></div>
    </div>
  </div>

  <script>
    // Load user data from localStorage (Clincoo stores user info there)
    (function() {
      var userName = localStorage.getItem('clincoo_user_name') || 'Pengguna';
      var userEmail = localStorage.getItem('clincoo_user_email') || 'user@clincoo.com';
      
      var nameEl = document.getElementById('profile-name');
      var emailEl = document.getElementById('profile-email');
      var avatarEl = document.getElementById('profile-avatar');
      
      if (nameEl) nameEl.textContent = userName;
      if (emailEl) emailEl.textContent = userEmail;
      
      // Generate initials from name
      if (avatarEl) {
        var initials = userName.split(' ').map(function(w) { return w[0]; }).join('').substring(0, 2).toUpperCase();
        if (!initials) initials = 'U';
        avatarEl.textContent = initials;
      }
    })();

    function goBack() {
      if (document.referrer && document.referrer.indexOf('clincoo') !== -1) {
        history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    function closeDetail() {
      var panel = document.getElementById('detail-panel');
      panel.classList.add('hidden');
    }

    function showSection(section) {
      var panel = document.getElementById('detail-panel');
      var title = document.getElementById('detail-title');
      var body = document.getElementById('detail-body');
      
      var content = '';
      
      if (section === 'workspace') {
        title.textContent = 'Workspace';
        content = '<div class="space-y-3">' +
          '<div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">' +
            '<div><p class="text-sm font-medium text-gray-900">Workspace</p><p class="text-xs text-gray-500 mt-0.5">Pribadi</p></div>' +
            '<span class="text-xs font-semibold text-gray-400">Aktif</span>' +
          '</div>' +
          '<p class="text-xs text-gray-500 leading-relaxed">Workspace pribadi Anda. Semua proyek yang Anda buat tersimpan di sini.</p>' +
        '</div>';
      } else if (section === 'keamanan') {
        title.textContent = 'Keamanan';
        content = '<div class="space-y-3">' +
          '<div class="p-3 bg-gray-50 rounded-xl">' +
            '<p class="text-sm font-medium text-gray-900 mb-1">Token GitHub</p>' +
            '<p class="text-xs text-gray-500" id="github-token-status">Mengecek...</p>' +
          '</div>' +
          '<div class="p-3 bg-gray-50 rounded-xl">' +
            '<p class="text-sm font-medium text-gray-900 mb-1">Domain Custom</p>' +
            '<p class="text-xs text-gray-500">Kelola domain khusus dari tab Halaman pada setiap proyek.</p>' +
          '</div>' +
          '<div class="p-3 bg-gray-50 rounded-xl">' +
            '<p class="text-sm font-medium text-gray-900 mb-1">Environment Variables</p>' +
            '<p class="text-xs text-gray-500">Variabel lingkungan dienkripsi dan disimpan dengan aman.</p>' +
          '</div>' +
        '</div>';
        // Check GitHub token
        setTimeout(function() {
          var ghToken = localStorage.getItem('github_token') || '';
          var el = document.getElementById('github-token-status');
          if (el) el.textContent = ghToken ? 'Terhubung' : 'Belum terhubung';
        }, 100);
      } else if (section === 'umum') {
        title.textContent = 'Umum';
        content = '<div class="space-y-3">' +
          '<div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">' +
            '<div><p class="text-sm font-medium text-gray-900">Tema</p><p class="text-xs text-gray-500 mt-0.5">Mengikuti sistem</p></div>' +
            '<svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>' +
          '</div>' +
          '<div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">' +
            '<div><p class="text-sm font-medium text-gray-900">Bahasa</p><p class="text-xs text-gray-500 mt-0.5">Indonesia</p></div>' +
            '<svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>' +
          '</div>' +
        '</div>';
      } else if (section === 'notifikasi') {
        title.textContent = 'Notifikasi';
        content = '<div class="space-y-3">' +
          '<div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">' +
            '<p class="text-sm font-medium text-gray-900">Status deploy</p>' +
            '<div class="relative inline-flex h-6 w-11 items-center rounded-full bg-gray-900">' +
              '<span class="inline-block h-4 w-4 transform rounded-full bg-white transition translate-x-6"></span>' +
            '</div>' +
          '</div>' +
          '<div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">' +
            '<p class="text-sm font-medium text-gray-900">Peringatan DNS</p>' +
            '<div class="relative inline-flex h-6 w-11 items-center rounded-full bg-gray-900">' +
              '<span class="inline-block h-4 w-4 transform rounded-full bg-white transition translate-x-6"></span>' +
            '</div>' +
          '</div>' +
          '<p class="text-xs text-gray-500">Notifikasi muncul di dalam aplikasi Clincoo.</p>' +
        '</div>';
      } else if (section === 'tentang') {
        title.textContent = 'Tentang Clincoo';
        content = '<div class="space-y-4">' +
          '<div class="flex flex-col items-center pt-2 pb-4">' +
            '<div class="w-16 h-16 bg-gray-900 rounded-2xl flex items-center justify-center mb-3 shadow-md">' +
              '<svg viewBox="0 0 32 32" class="w-10 h-10"><circle cx="16" cy="16" r="16" fill="#fff"/><g fill="#000"><path d="M10 16C7 10 9 7 12 7C14 7 15 11 13 16Z"/><path d="M22 16C25 10 23 7 20 7C18 7 17 11 19 16Z"/><path d="M16 27C24 27 28 22.5 28 17C28 12.5 21 11.5 16 11.5C11 11.5 4 12.5 4 17C4 22.5 8 27 16 27Z"/></g></svg>' +
            '</div>' +
            '<h4 class="text-lg font-bold text-gray-900">Clincoo</h4>' +
            '<p class="text-xs text-gray-500 mt-0.5">Versi 1.0.0</p>' +
          '</div>' +
          '<p class="text-sm text-gray-600 leading-relaxed text-center">Bangun & publikasikan situs web Anda dengan mudah. Clincoo adalah platform pengembangan web yang memungkinkan Anda membuat, mengedit, dan mendeploy proyek langsung dari browser.</p>' +
          '<div class="flex justify-center pt-2">' +
            '<a href="https://github.com/devconium/Clincoo.com" target="_blank" class="text-xs font-medium text-gray-700 underline">github.com/devconium/Clincoo.com</a>' +
          '</div>' +
        '</div>';
      }
      
      body.innerHTML = content;
      panel.classList.remove('hidden');
    }

    function logout() {
      if (confirm('Yakin ingin keluar?')) {
        localStorage.removeItem('github_token');
        localStorage.removeItem('clincoo_user_name');
        localStorage.removeItem('clincoo_user_email');
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
