  <script>
    function goBack() {
      if (document.referrer && document.referrer.indexOf('clincoo') !== -1) {
        history.back();
      } else {
        window.location.href = '../index.html';
      }
    }

    function loadProfileData() {
      var userName = localStorage.getItem('clincoo_user_name') || 'Pengguna';
      var userEmail = localStorage.getItem('clincoo_user_email') || 'user@clincoo.com';
      
      document.getElementById('profile-name').textContent = userName;
      document.getElementById('profile-email').textContent = userEmail;
      
      var initials = userName.split(' ').map(function(w) { return w[0]; }).join('').substring(0, 2).toUpperCase();
      if (!initials) initials = 'U';
      document.getElementById('profile-avatar').textContent = initials;

      var ghToken = localStorage.getItem('github_token') || '';
      var keamananSub = document.getElementById('keamanan-subtitle');
      if (keamananSub) keamananSub.textContent = ghToken ? 'GitHub terhubung' : 'GitHub belum terhubung';

      var theme = localStorage.getItem('clincoo_theme') || 'system';
      var umumSub = document.getElementById('umum-subtitle');
      if (umumSub) umumSub.textContent = theme === 'light' ? 'Terang' : theme === 'dark' ? 'Gelap' : 'Mengikuti sistem';

      var notifCount = getNotifActiveCount();
      var notifSub = document.getElementById('notifikasi-subtitle');
      if (notifSub) notifSub.textContent = notifCount > 0 ? notifCount + ' aktif' : 'Nonaktif';

      var projectCount = getProjectCount();
      var wsSub = document.getElementById('workspace-subtitle');
      if (wsSub) wsSub.textContent = projectCount + ' proyek';

      var members = getInviteCount();
      var invSub = document.getElementById('invite-subtitle');
      if (invSub) invSub.textContent = members + ' anggota';

      var storageSize = getStorageSize();
      var cloudSub = document.getElementById('cloud-subtitle');
      if (cloudSub) cloudSub.textContent = 'R2 - ' + storageSize + ' terpakai';
    }

    function getInviteCount() {
      var stored = localStorage.getItem('clincoo_invites');
      if (stored) { try { return JSON.parse(stored).length; } catch(e) { return 0; } }
      return 0;
    }

    function getStorageSize() {
      var total = 0;
      for (var key in localStorage) {
        if (key.indexOf('clincoo_') === 0) total += (localStorage[key] || '').length;
      }
      if (total < 1024) return total + ' B';
      if (total < 1048576) return (total / 1024).toFixed(1) + ' KB';
      return (total / 1048576).toFixed(1) + ' MB';
    }

    function getProjectCount() {
      var stored = localStorage.getItem('clincoo_projects') || localStorage.getItem('clincoo_projects_v2');
      if (stored) { try { return JSON.parse(stored).length; } catch(e) { return 0; } }
      return 0;
    }

    function getNotifKey(type) { return 'clincoo_notif_' + type; }

    function getNotifActiveCount() {
      var count = 0;
      ['deploy', 'dns', 'project'].forEach(function(t) {
        if (localStorage.getItem(getNotifKey(t)) !== 'false') count++;
      });
      return count;
    }

    function logout() {
      if (confirm('Yakin ingin keluar?')) {
        localStorage.removeItem('github_token');
        localStorage.removeItem('clincoo_user_name');
        localStorage.removeItem('clincoo_user_email');
        window.location.href = '../index.html';
      }
    }

    loadProfileData();
  </script>
