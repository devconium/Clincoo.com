<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Workspace - Clincoo</title>
 <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2216%22%20fill%3D%22%23ffffff%22%2F%3E%0A%20%20%3Cg%20fill%3D%22%23000000%22%3E%3Cpath%20d%3D%22M10%2016C7%2010%209%207%2012%207C14%207%2015%2011%2013%2016Z%22%2F%3E%3Cpath%20d%3D%22M16%2027C24%2027%2028%2022.5%2028%2017C28%2012.5%2021%2011.5%2016%2011.5C11%2011.5%204%2012.5%204%2017C4%2022.5%208%2027%2016%2027Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
 <script src="https://cdn.tailwindcss.com"></script>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
 <style>body{font-family:'Inter',sans-serif}.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}</style>
</head>
<body class="bg-[#f7f7f9] text-gray-900 min-h-screen flex flex-col">
 <div class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-50/60">
 <div class="w-full max-w-5xl px-4 sm:px-6 mx-auto">
 <div class="flex items-center justify-between h-14">
 <div class="flex items-center gap-1.5 sm:gap-3 min-w-0">
 <button onclick="history.back()" class="flex-shrink-0 flex items-center text-gray-500 hover:text-black transition-all rounded-full p-1.5 sm:p-2 hover:bg-gray-100 -ml-1.5 sm:-ml-2">
 <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
 </button>
 <h2 class="text-xl font-bold text-gray-800 tracking-tight">Workspace</h2>
 </div>
 <a href="../index.html"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2216%22%20fill%3D%22%23ffffff%22%2F%3E%0A%20%20%3Cg%20fill%3D%22%23000000%22%3E%3Cpath%20d%3D%22M10%2016C7%2010%209%207%2012%207C14%207%2015%2011%2013%2016Z%22%2F%3E%3Cpath%20d%3D%22M16%2027C24%2027%2028%2022.5%2028%2017C28%2012.5%2021%2011.5%2016%2011.5C11%2011.5%204%2012.5%204%2017C4%2022.5%208%2027%2016%2027Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" alt="Logo" class="w-8 h-8 md:w-9 md:h-9 rounded-lg bg-white shadow-sm"></a>
 </div>
 </div>
 </div>
 <main class="flex-1 overflow-y-auto no-scrollbar">
 <div class="max-w-2xl mx-auto w-full pb-12 pt-6 px-4">
 <div class="space-y-4">
 <div class="bg-white rounded-[24px] overflow-hidden shadow-sm">
 <div class="px-5 py-4 border-b border-gray-50">
 <div class="flex items-center gap-3">
 <div class="w-10 h-10 bg-gray-900 rounded-xl flex items-center justify-center">
 <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
 </div>
 <div><p class="text-base font-bold text-gray-900">Workspace Pribadi</p><p class="text-xs text-gray-500 mt-0.5">Workspace default Anda</p></div>
 </div>
 </div>
 <div class="px-5 py-4 space-y-3">
 <div class="flex items-center justify-between"><span class="text-sm text-gray-500">Jumlah proyek</span><span class="text-sm font-semibold text-gray-900" id="ws-project-count">0</span></div>
 <div class="h-[1px] bg-gray-100"></div>
 <div class="flex items-center justify-between"><span class="text-sm text-gray-500">Penyimpanan</span><span class="text-sm font-semibold text-gray-900" id="ws-storage-size">0 KB</span></div>
 <div class="h-[1px] bg-gray-100"></div>
 <div class="flex items-center justify-between"><span class="text-sm text-gray-500">Status</span><span class="text-sm font-semibold text-emerald-600">Aktif</span></div>
 </div>
 </div>
 <div class="bg-white rounded-[24px] overflow-hidden shadow-sm">
 <div class="px-5 py-4 border-b border-gray-50"><p class="text-base font-bold text-gray-900">Proyek Terbaru</p></div>
 <div id="ws-recent-projects" class="px-5 py-3"><p class="text-sm text-gray-500 py-2">Belum ada proyek.</p></div>
 </div>
 </div>
 </div>
 </main>
 <script>
 function getProjects(){var s=localStorage.getItem('clincoo_projects')||localStorage.getItem('clincoo_projects_v2');if(s){try{return JSON.parse(s)}catch(e){return[]}}return[]}
 function init(){var p=getProjects();document.getElementById('ws-project-count').textContent=p.length;var t=0;for(var k in localStorage){if(k.indexOf('clincoo_')===0)t+=(localStorage[k]||'').length}document.getElementById('ws-storage-size').textContent=t<1024?t+' B':t<1048576?(t/1024).toFixed(1)+' KB':(t/1048576).toFixed(1)+' MB';var c=document.getElementById('ws-recent-projects');if(p.length===0){c.innerHTML='<p class="text-sm text-gray-500 py-2">Belum ada proyek.</p>'}else{var h='';p.slice(-5).reverse().forEach(function(pr){var n=pr.name||pr.title||'Tanpa nama';var d=pr.created_date||pr.updated_date||'';if(d)d=new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short'});h+='<div class="flex items-center justify-between py-2.5 border-b border-gray-50 last:border-0"><div class="flex items-center gap-2.5 min-w-0"><svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg><span class="text-sm font-medium text-gray-900 truncate">'+n+'</span></div><span class="text-xs text-gray-400 flex-shrink-0 ml-3">'+d+'</span></div>'});c.innerHTML=h}}
 init();
 </script>
</body>
</html>
