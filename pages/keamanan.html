<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Keamanan - Clincoo</title>
 <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2216%22%20fill%3D%22%23ffffff%22%2F%3E%0A%20%20%3Cg%20fill%3D%22%23000000%22%3E%3Cpath%20d%3D%22M10%2016C7%2010%209%207%2012%207C14%207%2015%2011%2013%2016Z%22%2F%3E%3Cpath%20d%3D%22M16%2027C24%2027%2028%2022.5%2028%2017C28%2012.5%2021%2011.5%2016%2011.5C11%2011.5%204%2012.5%204%2017C4%2022.5%208%2027%2016%2027Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
 <script src="https://cdn.tailwindcss.com"></script>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
 <style>body{font-family:'Inter',sans-serif}.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}</style>
</head>
<body class="bg-[#f7f7f9] text-gray-900 min-h-screen flex flex-col">
 <div class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-50/60">
 <div class="w-full max-w-5xl px-4 sm:px-6 mx-auto">
 <div class="flex items-center justify-between h-14">
 <div class="flex items-center gap-1.5 sm:gap-3 min-w-0">
 <button onclick="goBack()" class="flex-shrink-0 flex items-center text-gray-500 hover:text-black transition-colors -ml-1.5 sm:-ml-2" aria-label="Kembali">
 <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
 </button>
 <h2 class="text-xl font-bold text-gray-800 tracking-tight">Keamanan</h2>
 </div>
 <a href="../index.html"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2216%22%20fill%3D%22%23ffffff%22%2F%3E%0A%20%20%3Cg%20fill%3D%22%23000000%22%3E%3Cpath%20d%3D%22M10%2016C7%2010%209%207%2012%207C14%207%2015%2011%2013%2016Z%22%2F%3E%3Cpath%20d%3D%22M16%2027C24%2027%2028%2022.5%2028%2017C28%2012.5%2021%2011.5%2016%2011.5C11%2011.5%204%2012.5%204%2017C4%2022.5%208%2027%2016%2027Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" alt="Logo" class="w-8 h-8 md:w-9 md:h-9 rounded-full bg-white shadow-sm"></a>
 </div>
 </div>
 </div>
 <main class="flex-1 overflow-y-auto no-scrollbar">
 <div class="max-w-2xl mx-auto w-full pb-12 pt-6 px-4">
 <div class="space-y-4">
 <div class="bg-white rounded-[24px] overflow-hidden shadow-sm">
 <div class="px-5 py-4 border-b border-gray-50"><p class="text-base font-bold text-gray-900">Token GitHub</p></div>
 <div class="px-5 py-4 space-y-3">
 <div class="flex items-center justify-between">
 <div><p class="text-sm font-medium text-gray-900">Status koneksi</p><p class="text-xs text-gray-500 mt-0.5" id="gh-token-status">Mengecek...</p></div>
 <span id="gh-token-badge" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-500">--</span>
 </div>
 <div class="flex gap-2">
 <button onclick="connectGithub()" class="flex-1 px-4 py-2.5 bg-gray-900 text-white text-sm font-medium rounded-xl hover:bg-gray-800 transition-colors">Hubungkan</button>
 <button onclick="disconnectGithub()" id="gh-disconnect-btn" class="flex-1 px-4 py-2.5 bg-white text-gray-700 text-sm font-medium rounded-xl hover:bg-gray-50 transition-colors hidden">Putuskan</button>
 </div>
 </div>
 </div>
 <div class="bg-white rounded-[24px] overflow-hidden shadow-sm">
 <div class="px-5 py-4 border-b border-gray-50"><p class="text-base font-bold text-gray-900">Domain Custom</p></div>
 <div class="px-5 py-4">
 <p class="text-sm text-gray-600 leading-relaxed">Kelola domain khusus dari tab Halaman pada setiap proyek di Clincoo.</p>
 <button onclick="window.location.href='../index.html'" class="mt-3 px-4 py-2 bg-gray-100 text-gray-700 text-sm font-medium rounded-xl hover:bg-gray-200 transition-colors">Buka Proyek</button>
 </div>
 </div>
 <div class="bg-white rounded-[24px] overflow-hidden shadow-sm">
 <div class="px-5 py-4 border-b border-gray-50"><p class="text-base font-bold text-gray-900">Environment Variables</p></div>
 <div class="px-5 py-4"><p class="text-sm text-gray-600 leading-relaxed">Variabel lingkungan dienkripsi dan disimpan dengan aman per proyek. Kelola dari tab Environment pada detail proyek.</p></div>
 </div>
 </div>
 </div>
 </main>
 <script>
 function goBack() {
 if (document.referrer && document.referrer.indexOf(window.location.hostname) !== -1) {
 history.back();
 } else {
 window.location.href = 'profile.html';
 }
 }

 function init(){var t=localStorage.getItem('clincoo_github_token')||'';var s=document.getElementById('gh-token-status'),b=document.getElementById('gh-token-badge'),d=document.getElementById('gh-disconnect-btn');if(t){s.textContent='Token tersimpan dan aktif';b.textContent='Terhubung';b.className='px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-600';d.classList.remove('hidden')}else{s.textContent='Belum ada token GitHub';b.textContent='Belum';b.className='px-2.5 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-500';d.classList.add('hidden')}}
 var _confirmCb = null;
 var _promptCb = null;
 function connectGithub(){showPromptModal('Masukkan GitHub Personal Access Token:',function(t){if(t&&t.trim()){localStorage.setItem('clincoo_github_token',t.trim());init()}})}
 function disconnectGithub(){showConfirmModal('Putuskan koneksi GitHub?',function(){localStorage.removeItem('clincoo_github_token');init()})}
 function showConfirmModal(message, onConfirm) {
 _confirmCb = onConfirm;
 var existing = document.getElementById('clincoo-confirm-modal');
 if (existing) existing.remove();
 var modal = document.createElement('div');
 modal.id = 'clincoo-confirm-modal';
 modal.className = 'fixed inset-0 z-[300] flex items-center justify-center p-4';
 modal.innerHTML = '<div class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm" onclick="_closeConfirm()"></div>' +
 '<div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6" style="animation:fadeIn 0.2s ease-out">' +
 '<div class="flex flex-col items-center text-center">' +
 '<div class="w-12 h-12 bg-amber-50 rounded-full flex items-center justify-center mb-4">' +
 '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" style="color:#f59e0b" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M12 3l9 16H3l9-16z"/></svg>' +
 '</div>' +
 '<p class="text-sm text-gray-700 font-medium mb-5">' + message + '</p>' +
 '<div class="flex gap-2 w-full">' +
 '<button onclick="_closeConfirm()" class="flex-1 px-5 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-xl hover:bg-gray-200 transition-colors">Batal</button>' +
 '<button onclick="_doConfirm()" class="flex-1 px-5 py-2 text-sm font-medium text-white bg-[#273849] rounded-xl hover:bg-[#1a2530] transition-colors">Ya</button>' +
 '</div>' +
 '</div>' +
 '</div>';
 document.body.appendChild(modal);
 }
 function _doConfirm() { _closeConfirm(); if (_confirmCb) { _confirmCb(); _confirmCb = null; } }
 function _closeConfirm() { var m = document.getElementById('clincoo-confirm-modal'); if (m) m.remove(); }
 function showPromptModal(message, onSubmit) {
 _promptCb = onSubmit;
 var existing = document.getElementById('clincoo-prompt-modal');
 if (existing) existing.remove();
 var modal = document.createElement('div');
 modal.id = 'clincoo-prompt-modal';
 modal.className = 'fixed inset-0 z-[300] flex items-center justify-center p-4';
 modal.innerHTML = '<div class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm" onclick="_closePrompt()"></div>' +
 '<div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6" style="animation:fadeIn 0.2s ease-out">' +
 '<div class="flex flex-col items-center text-center">' +
 '<div class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center mb-4">' +
 '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" style="color:#3b82f6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' +
 '</div>' +
 '<p class="text-sm text-gray-700 font-medium mb-3">' + message + '</p>' +
 '<input type="text" id="clincoo-prompt-input" class="w-full bg-gray-100 border-0 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gray-200 mb-4" placeholder="Masukkan token...">' +
 '<div class="flex gap-2 w-full">' +
 '<button onclick="_closePrompt()" class="flex-1 px-5 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-xl hover:bg-gray-200 transition-colors">Batal</button>' +
 '<button onclick="_doPrompt()" class="flex-1 px-5 py-2 text-sm font-medium text-white bg-[#273849] rounded-xl hover:bg-[#1a2530] transition-colors">OK</button>' +
 '</div>' +
 '</div>' +
 '</div>';
 document.body.appendChild(modal);
 setTimeout(function() { document.getElementById('clincoo-prompt-input').focus(); }, 100);
 document.getElementById('clincoo-prompt-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') _doPrompt(); });
 }
 function _doPrompt() { var v = document.getElementById('clincoo-prompt-input').value; _closePrompt(); if (_promptCb) { _promptCb(v); _promptCb = null; } }
 function _closePrompt() { var m = document.getElementById('clincoo-prompt-modal'); if (m) m.remove(); }
 init();
 </script>
</body>
</html>
